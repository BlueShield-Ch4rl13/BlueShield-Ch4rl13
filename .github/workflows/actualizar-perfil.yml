name: Actualizar perfil

# Regenera las dos partes vivas del README: el panel de estado y la lista
# de ultimos despliegues. Diario a las 06:00 UTC y a demanda.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generar_perfil.py"
      - ".github/workflows/actualizar-perfil.yml"

permissions:
  contents: write

# Nunca dos a la vez: si coinciden el cron, un push y una ejecución a mano,
# la segunda espera y publica encima de la primera en vez de fallar al empujar.
concurrency:
  group: actualizar-perfil
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Generar panel de estado y despliegues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generar_perfil.py

      - name: Publicar si hay cambios
        run: |
          if git diff --quiet; then
            echo "Sin cambios: no se hace commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/estado.svg README.md
          git commit -m "actualiza estado del puesto y ultimos despliegues"
          # Si main avanzó mientras tanto, se reaplica encima. Sin -X theirs: con
          # él, un README generado antes de fusionar un PR deshacía ese PR. Si hay
          # conflicto no se publica; la siguiente ejecución (cada día a las 06:00
          # UTC, o a mano) lo regenera ya sobre el README nuevo.
          if ! git pull --rebase origin main; then
            git rebase --abort
            echo "::warning::main ha cambiado en lo mismo que esta ejecución: no se publica para no deshacer nada."
            exit 0
          fi
          git push
